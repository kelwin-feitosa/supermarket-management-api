name: Documentação

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compilar documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements-docs.txt
      - name: Validar site estático
        run: zensical build --clean
      - name: Verificar JavaScript
        run: node --check docs/javascripts/portal.js
      - name: Verificar arquivos e conteúdo da página
        run: |
          test -s site/index.html
          test -s site/stylesheets/advanced.css
          test -s site/javascripts/portal.js
          test -s site/assets/brand.svg
          grep -q 'studio-module-button' site/index.html
          grep -q 'studio-topic-card' site/index.html

  publish:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements-docs.txt
      - name: Compilar site
        run: zensical build --clean
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
